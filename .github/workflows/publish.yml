name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (patch/minor/none). Use 'none' for major releases — bump package.json manually before dispatching."
        required: true
        type: choice
        options:
          - patch
          - minor
          - none
      dry-run:
        description: "Dry run (skip actual publish)"
        required: false
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@5b4374b04084dc1f9032b52464284b769ac5059e # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g tsx
      - run: pnpm run build
      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@5b4374b04084dc1f9032b52464284b769ac5059e # v4
        with:
          version: 9
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Branch guard
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "::error::Publishing is only allowed from the main branch (current: ${{ github.ref_name }})"
          exit 1

      - name: Bump version
        if: ${{ inputs.bump != 'none' }}
        run: npm version ${{ inputs.bump }} --no-git-tag-version

      - name: Commit and push version bump
        if: ${{ inputs.bump != 'none' && !inputs.dry-run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: release v$VERSION"
          git push

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Version guard
        run: |
          if npm view "mcp-filter@${{ steps.version.outputs.version }}" version 2>/dev/null; then
            echo "::error::Version ${{ steps.version.outputs.version }} is already published to npm"
            exit 1
          fi

      - name: Publish (dry run)
        if: ${{ inputs.dry-run }}
        run: npm publish --provenance --access public --ignore-scripts --dry-run

      - name: Publish
        if: ${{ !inputs.dry-run }}
        run: npm publish --provenance --access public --ignore-scripts

  tag-and-release:
    needs: publish
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create and push tag
        run: |
          TAG="v${{ needs.publish.outputs.version }}"
          if git ls-remote --tags origin "$TAG" | grep -q "$TAG"; then
            echo "Tag $TAG already exists, skipping"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ needs.publish.outputs.version }}"
          gh release create "$TAG" --generate-notes --title "$TAG" || echo "Release already exists for $TAG, skipping"
